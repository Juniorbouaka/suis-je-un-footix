# Configuration Fly.io — alternative a Railway.
# Cree d'abord le volume :  fly volumes create footix_data --size 1

app = "suis-je-un-footix"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  DATABASE_FILE = "/data/footix.db"

[[mounts]]
  source = "footix_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"
