# Configuration Railway — https://docs.railway.com/reference/config-as-code
#
# Le volume est indispensable : sans lui, la base SQLite est effacée
# a chaque redeploiement (comptes, scores, series, cache).

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server/src/index.js"

# Railway interroge cette route regulierement : si le serveur ne repond plus,
# le conteneur est redemarre automatiquement. Le delai est genereux car la
# premiere initialisation cree la base et ecrit une sauvegarde.
healthcheckPath = "/api/health"
healthcheckTimeout = 300

restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# Une seule instance : l'etat du matchmaking et des duels vit en memoire.
# Passer a plusieurs instances demanderait un adaptateur Redis pour Socket.io.
numReplicas = 1
